# Déploiement sur Render (https://render.com) : New → Blueprint → choisir ce dépôt.
# Le disque persistant conserve la base de données et les fichiers téléversés.
services:
  - type: web
    name: prestigio-events
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      # Jeton du lien d'installation à usage unique : /admin/installation/<SETUP_TOKEN>
      - key: SETUP_TOKEN
        generateValue: true
      - key: BASE_URL
        sync: false
    disk:
      name: prestigio-data
      mountPath: /var/data
      sizeGB: 1
