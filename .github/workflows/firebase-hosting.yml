# Publie automatiquement la version de démonstration sur Firebase Hosting
# (https://prestigioevent-1bdde.web.app) à chaque envoi de code.
# Prérequis : le secret GitHub PRESTIGIOEVENT (ou FIREBASE_SERVICE_ACCOUNT), voir README « Firebase ».
name: Firebase Hosting (démonstration)

on:
  push:
    branches: [main, claude/prestigio-events-site]
    paths: ['firebase/**', 'firebase.json', '.firebaserc', '.github/workflows/firebase-hosting.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.PRESTIGIOEVENT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: prestigioevent-1bdde
          channelId: live
